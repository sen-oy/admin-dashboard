<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="header">
        <div id="search-section">
            <img />
            <input type="search" />
        </div>
        <div id="notification-section">
            <img />
            <img />
            <p>Morgan Oakley</p>
        </div>
        <div id="greeting-section">
            <img />
            <p id="greeting-text">Hi there, </p>
            <p id="greeting-name">Morgan Oakley (@morgan)</p>
        </div>
        <div id="new-action-section">
            <button class="new-action-button">New</button>
            <button class="new-action-button">Upload</button>
            <button class="new-action-button">Share</button>
        </div>
    </div>

    <div id="sidebar">
        <div id="dashboard-title"></div>
        <div id="dashboard-items">
            <div id="dashboard-menu">
                <div class="dashboard-menu-item">
                    <img />
                    <p>Home</p>
                </div>
                <div class="dashboard-menu-item">
                    <img />
                    <p>Profile</p>
                </div>
                <div class="dashboard-menu-item">
                    <img />
                    <p>Messages</p>
                </div>
                <div class="dashboard-menu-item">
                    <img />
                    <p>History</p>
                </div>
                <div class="dashboard-menu-item">
                    <img />
                    <p>Tasks</p>
                </div>
                <div class="dashboard-menu-item">
                    <img />
                    <p>Communities</p>
                </div>
            </div>
            <div id="dashboard-admin">
                <div class="dashboard-admin-item">
                    <img />
                    <p>Settings</p>
                </div>
                <div class="dashboard-admin-item">
                    <img />
                    <p>Support</p>
                </div>
                <div class="dashboard-admin-item">
                    <img />
                    <p>Privacy</p>
                </div>
            </div>
        </div>
    </div>

    <div id="main-content">
        <div id="project-section">
            <p>Your Projects</p>
            <div id="project-cards">
                <article class="project-card"></article>
                <article class="project-card"></article>
                <article class="project-card"></article>
                <article class="project-card"></article>
                <article class="project-card"></article>
                <article class="project-card"></article>
            </div>
        </div>
        <div id="announcement-section">
            <p>Announcements</p>
            <div id="announcement-sections">
                <section class="announcement"></section>
                <section class="announcement"></section>
                <section class="announcement"></section>
            </div>
        </div>
        <div id="trending-section">
            <p>Trending</p>
            <div id="trending-sections">
                <section class="trending-profile"></section>
                <section class="trending-profile"></section>
                <section class="trending-profile"></section>
                <section class="trending-profile"></section>
            </div>
        </div>
    </div>
</body>
</html>
